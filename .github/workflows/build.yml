
name: Build OnePlus Ace 3 - KernelSU Next + SUSFS

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ace3-kernel-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: WildKernels/OnePlus_KernelSU_SUSFS
  UPSTREAM_REF: d44240312aeb978463b66c3a3155c6d99a7c7a3c
  CONFIG_FILE: configs/a16/OP-ACE-3-5.15.167.json
  MANIFEST_FILE: manifests/a16/oneplus_ace3_5.15.167_w.xml
  CACHE_TAG: toolchain-cache

jobs:

  # ==========================================================
  # JOB 1: 获取配置、Manifest，准备构建工具链缓存
  # ==========================================================

  prepare:
    name: Prepare Source Configuration and Toolchains
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    outputs:
      config_json: ${{ steps.config.outputs.json }}
      toolchains: ${{ steps.manifest.outputs.toolchains }}

    steps:

      - name: Checkout pinned upstream repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1

      # ------------------------------------------------------
      # 1. 验证设备配置
      # ------------------------------------------------------

      - name: Validate Ace 3 configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="upstream/${CONFIG_FILE}"

          test -f "$CONFIG"

          echo "===== ACE 3 CONFIG ====="
          jq '.' "$CONFIG"

          jq -e '
            .model == "OP-ACE-3-5.15.167" and
            .soc == "kalama" and
            .branch == "wild/sm8550" and
            .manifest == "oneplus_ace3_5.15.167_w.xml" and
            .android_version == "android13" and
            .kernel_version == "5.15" and
            .os_version == "A16" and
            .lto == "thin" and
            .c_compiler == "kernel_platform/prebuilts/clang/host/linux-x86/clang-r450784e/bin" and
            .rust_build == false and
            .susfs == true and
            .opt == true
          ' "$CONFIG"

          CONFIG_JSON="$(jq -c '.' "$CONFIG")"

          echo "json=$CONFIG_JSON" >> "$GITHUB_OUTPUT"

          echo "Ace 3 configuration validated."

      # ------------------------------------------------------
      # 2. 解析 Manifest，确定所需的工具链
      # ------------------------------------------------------

      - name: Parse device manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          import os

          path = "upstream/" + os.environ["MANIFEST_FILE"]

          root = ET.parse(path).getroot()

          remotes = {
              r.get("name"): r.get("fetch").rstrip("/")
              for r in root.findall("remote")
          }

          default = root.find("default")
          default_remote = default.get("remote")
          default_revision = default.get("revision")

          TOOLCHAIN_MAP = {
              "clang/host/linux-x86": "clang",
              "prebuilts/rust": "rust",
              "prebuilts/clang-tools": "clang-tools",
              "kernel/prebuilts/build-tools": "build-tools",
              "AnyKernel3": "AnyKernel3"
          }

          result = {}

          for project in root.findall("project"):
              name = project.get("name")

              label = None

              for key, value in TOOLCHAIN_MAP.items():
                  if key in name:
                      label = value
                      break

              if not label:
                  continue

              remote = project.get("remote", default_remote)
              revision = project.get("revision", default_revision)
              base = remotes.get(remote)

              if not base or not revision:
                  raise RuntimeError(
                      f"Missing remote/revision: {name}"
                  )

              if "googlesource.com" in base:
                  url = f"{base}/{name}/+archive/{revision}.tar.gz"

              elif "github.com" in base:
                  url = f"{base}/{name}/archive/{revision}.tar.gz"

              elif "git.codelinaro.org" in base or "gitlab.com" in base:
                  basename = name.split("/")[-1]
                  url = (
                      f"{base}/{name}/-/archive/"
                      f"{revision}/{basename}-{revision}.tar.gz"
                  )

              else:
                  raise RuntimeError(
                      f"Unsupported source: {base}"
                  )

              filename = f"{label}-{revision}.tar.gz"

              result[filename] = {
                  "name": name,
                  "label": label,
                  "revision": revision,
                  "filename": filename,
                  "url": url
              }

          entries = list(result.values())

          if not entries:
              raise RuntimeError("No toolchains found in manifest")

          print("===== REQUIRED TOOLCHAINS =====")

          for item in entries:
              print(item["filename"])
              print(item["url"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(
                  "toolchains=" +
                  json.dumps(entries, separators=(",", ":")) +
                  "\n"
              )
          PY

      # ------------------------------------------------------
      # 3. 创建自己的工具链缓存 Release
      # ------------------------------------------------------

      - name: Prepare toolchain cache release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$CACHE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$CACHE_TAG" \
            --title "Kernel Toolchain Cache" \
            --notes "Ace 3 kernel build toolchain cache" \
            --repo "$GITHUB_REPOSITORY"

      # ------------------------------------------------------
      # 4. 下载并缓存 Clang / Build-tools / AnyKernel3
      # ------------------------------------------------------

      - name: Mirror required toolchains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAINS_JSON: ${{ steps.manifest.outputs.toolchains }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y aria2

          CACHE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CACHE_TAG}"

          while IFS= read -r item; do

            FILENAME="$(jq -r '.filename' <<< "$item")"
            URL="$(jq -r '.url' <<< "$item")"

            echo ""
            echo "========================================"
            echo "Checking: $FILENAME"
            echo "========================================"

            STATUS="$(curl -sIL -o /dev/null \
              -w '%{http_code}' "$CACHE_URL/$FILENAME" || true)"

            PART_STATUS="$(curl -sIL -o /dev/null \
              -w '%{http_code}' "$CACHE_URL/${FILENAME}.partaa" || true)"

            if [[ "$STATUS" == "200" || "$PART_STATUS" == "200" ]]; then
              echo "Already cached: $FILENAME"
              continue
            fi

            echo "Downloading: $URL"

            aria2c \
              -x16 -s16 -k1M -j5 \
              --file-allocation=none \
              --console-log-level=error \
              --summary-interval=0 \
              --retry-wait=5 \
              --max-tries=10 \
              -o "$FILENAME" \
              "$URL"

            SIZE="$(stat -c%s "$FILENAME")"

            if (( SIZE > 2000000000 )); then

              echo "Splitting large archive..."

              split -b 1500M -a 2 \
                "$FILENAME" "${FILENAME}.part"

              for PART in "${FILENAME}".part*; do

                echo "Uploading $PART"

                gh release upload "$CACHE_TAG" "$PART" \
                  --clobber \
                  --repo "$GITHUB_REPOSITORY"

              done

            else

              echo "Uploading $FILENAME"

              gh release upload "$CACHE_TAG" "$FILENAME" \
                --clobber \
                --repo "$GITHUB_REPOSITORY"

            fi

            rm -f "$FILENAME"
            rm -f "${FILENAME}".part*

          done < <(jq -c '.[]' <<< "$TOOLCHAINS_JSON")

          echo "All required toolchains are cached."

  # ==========================================================
  # JOB 2: 完整编译内核
  # ==========================================================

  build:
    name: Build Ace 3 Kernel
    needs: prepare

    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ------------------------------------------------------
      # 1. 清理 Runner 磁盘空间
      # ------------------------------------------------------

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "===== DISK BEFORE CLEANUP ====="
          df -h /

          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          echo "===== DISK AFTER CLEANUP ====="
          df -h /

      # ------------------------------------------------------
      # 2. 安装编译依赖
      # ------------------------------------------------------

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            dwarves \
            flex \
            file \
            git \
            jq \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            make \
            openssl \
            pigz \
            python3 \
            python3-pip \
            python3-requests \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            zstd

          echo "===== BUILD DEPENDENCIES READY ====="

      # ------------------------------------------------------
      # 3. 调用上游完整构建 Action
      # ------------------------------------------------------

      - name: Build KernelSU Next + SUSFS Kernel
        id: kernel
        uses: WildKernels/OnePlus_KernelSU_SUSFS/.github/actions/build-kernel@d44240312aeb978463b66c3a3155c6d99a7c7a3c

        with:

          # Ace 3 专用配置
          op_config_json: ${{ needs.prepare.outputs.config_json }}

          # KernelSU Next
          ksu_type: KSUN
          ksu_branch_or_hash: ""

          # 自动选择 gki-android13-5.15
          susfs_commit_hash_or_branch: ""

          # 编译参数
          optimize_level: O2

          # 使用 ccache
          clean: false

          # 启用调试产物
          debug: true

          # GitHub Token
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------
      # 4. 输出编译结果
      # ------------------------------------------------------

      - name: Build result
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ONEPLUS ACE 3 KERNEL BUILD SUCCESS"
          echo "======================================"

          echo "Kernel Version:"
          echo "${{ steps.kernel.outputs.kernel_version }}"

          echo "KernelSU Version:"
          echo "${{ steps.kernel.outputs.ksu_version }}"

          echo "SUSFS Version:"
          echo "${{ steps.kernel.outputs.susfs_version }}"

          echo "Kernel Image SHA256:"
          echo "${{ steps.kernel.outputs.image_sha256 }}"

          echo "AnyKernel3 ZIP SHA256:"
          echo "${{ steps.kernel.outputs.zip_sha256 }}"

          echo "ZIP Name:"
          echo "${{ steps.kernel.outputs.zip_name }}"

          echo "Build Time:"
          echo "${{ steps.kernel.outputs.build_time }} seconds"

          echo "======================================"
